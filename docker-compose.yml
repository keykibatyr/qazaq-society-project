    command: go run cmd/server/main.go
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: keykibatyr
      POSTGRES_PASSWORD: Alisher0505
      POSTGRES_DB: qazaqsociety
    ports:
